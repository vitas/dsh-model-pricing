name: promos
# Validates `promos/**` on pull requests and publishes the compiled feed to the
# orphan `gh-pages` branch on merge (docs/architecture.md §4.3). The plugin
# fetches only https://raw.githubusercontent.com/<owner>/<repo>/gh-pages/promo-dist/index.json
on:
  pull_request:
    paths:
      - 'promos/**'
      - '.github/workflows/promos.yml'
      - 'scripts/validate-promos.mjs'
      - 'scripts/compile-promos.mjs'
  push:
    branches: [main]
    paths:
      - 'promos/**'
      - '.github/workflows/promos.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate promotion records
        run: node scripts/validate-promos.mjs

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compile the active feed
        run: node scripts/compile-promos.mjs
      - name: Publish promo-dist to the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .ci-publish/promo-dist
          cp promo-dist/index.json .ci-publish/promo-dist/
          cd .ci-publish
          git init -q -b gh-pages
          git config user.name "promo-bot"
          git config user.email "promo-bot@users.noreply.github.com"
          git add -f promo-dist/index.json
          git commit -qm "promo feed $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
